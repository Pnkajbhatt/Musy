spring:
  application:
    name: api-gateway-service
  codec:
    max-in-memory-size: 20MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "https://musy-five.vercel.app"
              - "https://musy-git-main-pankaj-bhatt-s-projects.vercel.app"
              - "https://*.vercel.app"
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      httpclient:
        connect-timeout: 30000
        response-timeout: 120s
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: music-service
          uri: lb://music-service
          predicates:
            - Path=/api/song,/api/song/**,/api/songs,/api/songs/**,/api/files/**
        - id: like-service
          uri: lb://like-service
          predicates:
            - Path=/api/likes/**
        - id: history-service
          uri: lb://history-service
          predicates:
            - Path=/api/history/**

server:
  port: 8080

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
