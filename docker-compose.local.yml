services:
  eureka-server:
    build:
      context: ./eureka-service
    container_name: eureka-server-local
    ports:
      - "8761:8761"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
    networks:
      - musy-network-local

  api-gateway:
    build:
      context: ./api-gateway-service
    container_name: api-gateway-local
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - USER_SERVICE_URI=http://user-service:8082
      - AUTH_SERVICE_URI=http://auth-service:8081
      - MUSIC_SERVICE_URI=http://music-service:8083
      - LIKE_SERVICE_URI=http://like-service:8084
      - HISTORY_SERVICE_URI=http://history-service:8085
    networks:
      - musy-network-local

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service-local
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - APP_OAUTH2_REDIRECT_URI=http://localhost:3000/
    networks:
      - musy-network-local

  user-service:
    build:
      context: ./user-service
    container_name: user-service-local
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - APP_API_BASE_URL=http://localhost:8080
    networks:
      - musy-network-local

  music-service:
    build:
      context: ./music-service
    container_name: music-service-local
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - APP_API_BASE_URL=http://localhost:8080
    networks:
      - musy-network-local

  like-service:
    build:
      context: ./like-service
    container_name: like-service-local
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - musy-network-local

  history-service:
    build:
      context: ./history-service
    container_name: history-service-local
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    networks:
      - musy-network-local

  frontend:
    build:
      context: ./musyFrontend
      args:
        - VITE_BACKEND_URL=http://localhost:8080
    container_name: frontend-local
    ports:
      - "3000:80"
    networks:
      - musy-network-local

networks:
  musy-network-local:
    driver: bridge
