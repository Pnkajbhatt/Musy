version: "3.8"

services:
  eureka-server:
    build:
      context: ./eureka-service
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - musy-network

  api-gateway:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    env_file:
      - .env
    networks:
      - musy-network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    env_file:
      - .env
    networks:
      - musy-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    env_file:
      - .env
    networks:
      - musy-network

  music-service:
    build:
      context: ./music-service
      dockerfile: Dockerfile
    container_name: music-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
    env_file:
      - .env
    networks:
      - musy-network

  # like-service:
  #   build:
  #     context: ./like-service
  #     dockerfile: Dockerfile
  #   container_name: like-service
  #   ports:
  #     - "8084:8084"
  #   depends_on:
  #     - eureka-server
  #   env_file:
  #     - .env
  #   networks:
  #     - musy-network

  # history-service:
  #   build:
  #     context: ./history-service
  #     dockerfile: Dockerfile
  #   container_name: history-service
  #   ports:
  #     - "8085:8085"
  #   depends_on:
  #     - eureka-server
  #   env_file:
  #     - .env
  #   networks:
  #     - musy-network

  musy-frontend:
    build:
      context: ./musyFrontend
      dockerfile: Dockerfile
    container_name: musy-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - musy-network

networks:
  musy-network:
    driver: bridge
