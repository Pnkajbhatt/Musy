spring:
  application:
    name: eureka-service
  profiles:
    default: local
    group:
      prod:
        - ec2

server:
  port: 8761

eureka:
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    renewal-percent-threshold: 0.49
  client:
    register-with-eureka: false
    fetch-registry: false
