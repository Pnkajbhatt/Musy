spring:
  application:
    name: user-service
  profiles:
    default: local
    group:
      prod:
        - ec2
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:./user-service/.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  jwt:
    secret: ${JWT_SECRETE_KEY}
    expiration-ms: ${JWT_EXPIRE}

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true

aws:
  s3:
    bucket: musys3-151963020801-ap-south-1-an
    region: ap-south-1
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
