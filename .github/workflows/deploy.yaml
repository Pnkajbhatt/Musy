name: Build and Deploy Musy

on:
  push:
    branches:
      - main

jobs:
  # ============================================================
  # 1. DETECT CHANGED SERVICES
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      eureka: ${{ steps.filter.outputs.eureka }}
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      music: ${{ steps.filter.outputs.music }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eureka:
              - 'eureka-service/**'

            gateway:
              - 'api-gateway-service/**'

            auth:
              - 'auth-service/**'

            user:
              - 'user-service/**'

            music:
              - 'music-service/**'

  # ============================================================
  # 2. BUILD & PUSH EUREKA
  # ============================================================
  build-eureka:
    needs: detect-changes
    if: needs.detect-changes.outputs.eureka == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Eureka
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-service
          push: true
          tags: pankajbhatt/musy-eureka:latest

  # ============================================================
  # 3. BUILD & PUSH API GATEWAY
  # ============================================================
  build-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway-service
          push: true
          tags: pankajbhatt/musy-api-gateway:latest

  # ============================================================
  # 4. BUILD & PUSH AUTH SERVICE
  # ============================================================
  build-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: pankajbhatt/musy-auth:latest

  # ============================================================
  # 5. BUILD & PUSH USER SERVICE
  # ============================================================
  build-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: pankajbhatt/musy-user:latest

  # ============================================================
  # 6. BUILD & PUSH MUSIC SERVICE
  # ============================================================
  build-music:
    needs: detect-changes
    if: needs.detect-changes.outputs.music == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Music Service
        uses: docker/build-push-action@v6
        with:
          context: ./music-service
          push: true
          tags: pankajbhatt/musy-music:latest

  # ============================================================
  # 7. DEPLOY TO EC2
  # ============================================================
  deploy:
    needs:
      - detect-changes
      - build-eureka
      - build-gateway
      - build-auth
      - build-user
      - build-music

    if: |
      always() &&
      (
        needs.detect-changes.outputs.eureka == 'true' ||
        needs.detect-changes.outputs.gateway == 'true' ||
        needs.detect-changes.outputs.auth == 'true' ||
        needs.detect-changes.outputs.user == 'true' ||
        needs.detect-changes.outputs.music == 'true'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy changed services to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /home/ubuntu/musy

            echo "Logging into Docker Hub..."

            docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              -p "${{ secrets.DOCKERHUB_TOKEN }}"


            # =========================
            # EUREKA
            # =========================

            if [ "${{ needs.detect-changes.outputs.eureka }}" = "true" ]; then

              echo "Updating Eureka..."

              docker compose pull eureka-server

              docker compose up -d eureka-server

            fi


            # =========================
            # API GATEWAY
            # =========================

            if [ "${{ needs.detect-changes.outputs.gateway }}" = "true" ]; then

              echo "Updating API Gateway..."

              docker compose pull api-gateway

              docker compose up -d api-gateway

            fi


            # =========================
            # AUTH SERVICE
            # =========================

            if [ "${{ needs.detect-changes.outputs.auth }}" = "true" ]; then

              echo "Updating Auth Service..."

              docker compose pull auth-service

              docker compose up -d auth-service

            fi


            # =========================
            # USER SERVICE
            # =========================

            if [ "${{ needs.detect-changes.outputs.user }}" = "true" ]; then

              echo "Updating User Service..."

              docker compose pull user-service

              docker compose up -d user-service

            fi


            # =========================
            # MUSIC SERVICE
            # =========================

            if [ "${{ needs.detect-changes.outputs.music }}" = "true" ]; then

              echo "Updating Music Service..."

              docker compose pull music-service

              docker compose up -d music-service

            fi


            echo "Deployment completed."

            docker compose ps
